name: Build executables

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]   # a version tag (e.g. v1.0.1) builds and publishes a GitHub release
    paths:
      - firewire2mp4.py
      - build.py
      - .github/workflows/build.yml
      - assets/**

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # build.py installs the dependencies, bundles ffmpeg, builds and self-tests the result
      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v7
        with:
          name: FireWire2MP4-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "V${TAG#v}" --generate-notes

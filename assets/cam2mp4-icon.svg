<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24476f"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa143"/>
      <stop offset="1" stop-color="#e8530c"/>
    </linearGradient>
    <g id="reel">
      <circle r="38" fill="#0d1b2e"/>
      <circle r="27" fill="#e2e8f0"/>
      <circle r="9" fill="#0d1b2e"/>
      <g fill="#0d1b2e">
        <rect x="-4" y="-27" width="8" height="12"/>
        <rect x="-4" y="-27" width="8" height="12" transform="rotate(120)"/>
        <rect x="-4" y="-27" width="8" height="12" transform="rotate(240)"/>
      </g>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- MiniDV cassette -->
  <g transform="rotate(-8 230 230)">
    <rect x="62" y="120" width="330" height="210" rx="26" fill="url(#tape)"/>
    <rect x="62" y="120" width="330" height="44" rx="22" fill="#94a3b8"/>
    <rect x="62" y="142" width="330" height="22" fill="#94a3b8"/>
    <text x="227" y="152" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="26" letter-spacing="4" fill="#0d1b2e">DV</text>
    <rect x="104" y="190" width="246" height="100" rx="18" fill="#334155"/>
    <rect x="160" y="222" width="134" height="36" rx="6" fill="#475569"/>
    <use href="#reel" x="160" y="240"/>
    <use href="#reel" x="294" y="240"/>
  </g>
  <!-- Play / MP4 badge -->
  <circle cx="362" cy="352" r="112" fill="#0d1b2e" opacity="0.45"/>
  <circle cx="356" cy="346" r="104" fill="url(#play)"/>
  <path d="M326 296 L414 346 L326 396 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
